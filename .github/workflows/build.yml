name: build

on:
  push:
  pull_request:
  workflow_dispatch:

# Windows(MSVC) = Qt 6.8 LTS (실행 PC 대상, 6.8 호환성 검증) / macOS = Qt 6.10
#  (Qt 6.8 의 macOS 빌드는 최신 Xcode SDK 에서 제거된 AGL 프레임워크를 링크하려 해 실패하므로 6.10 사용)
# Windows 는 windeployqt 배포 폴더를 아티팩트로 업로드 (ThinkPad 실행 점검용)
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-msvc
            os: windows-latest
            qt_version: "6.8.3"
            qt_arch: win64_msvc2022_64
          - name: macos
            os: macos-latest
            qt_version: "6.10.1"
            qt_arch: clang_64
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y --no-progress

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"
          -DCTRLSW_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        timeout-minutes: 10
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure --timeout 120

      - name: Deploy (windeployqt)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force deploy | Out-Null
          # qt_standard_project_setup() 은 Windows 에서 실행파일을 빌드 루트에 모음 → 위치 무관하게 검색
          $app  = Get-ChildItem build -Recurse -Filter CtrlSW.exe | Select-Object -First 1
          $mock = Get-ChildItem build -Recurse -Filter ctrlsw_mock.exe | Select-Object -First 1
          if (-not $app -or -not $mock) { throw "exe not found" }
          Copy-Item $app.FullName deploy/
          Copy-Item $mock.FullName deploy/
          Copy-Item -Recurse samples deploy/samples
          Copy-Item resources/protocol/protocol.json deploy/protocol.json.example
          windeployqt --release --no-translations --compiler-runtime deploy/CtrlSW.exe
          windeployqt --release --no-translations deploy/ctrlsw_mock.exe

      - name: Smoke test (deployed exe)
        if: runner.os == 'Windows'
        timeout-minutes: 8
        shell: pwsh
        run: |
          # 실행을 타임아웃·출력 캡처로 감싸서 멈춤(오류 대화상자 등) 시에도 원인을 남긴다
          function Invoke-Timed([string]$exe, [string[]]$argv, [int]$sec) {
            Write-Host "== $exe $($argv -join ' ')"
            $p = Start-Process $exe -ArgumentList $argv -PassThru -NoNewWindow -RedirectStandardOutput out.txt -RedirectStandardError err.txt
            $done = $p.WaitForExit($sec * 1000)
            if (-not $done) { $p.Kill() }
            Get-Content out.txt, err.txt -ErrorAction SilentlyContinue | Select-Object -Last 30 | ForEach-Object { Write-Host $_ }
            if (-not $done) { throw "timeout ($sec s): $exe" }
            Write-Host "exit=$($p.ExitCode)"
            return [int]$p.ExitCode   # 파이프라인에는 종료코드만
          }
          Write-Host "--- deploy 폴더"
          Get-ChildItem deploy -Recurse -Name | Select-Object -First 60
          Write-Host "--- 의존 DLL (배포 폴더/시스템에 없으면 MISSING)"
          foreach ($exe in 'deploy\CtrlSW.exe', 'deploy\ctrlsw_mock.exe') {
            # api-ms-win-* 는 OS API Set (실파일 아님) → 제외
            $deps = dumpbin /dependents $exe | Select-String '\.dll' | ForEach-Object { $_.ToString().Trim() } | Where-Object { $_ -notlike 'api-ms-win-*' }
            foreach ($d in $deps) {
              $found = (Test-Path "deploy\$d") -or (Test-Path "$env:WINDIR\System32\$d")
              Write-Host ("{0,-40} {1}" -f $d, $(if ($found) { 'ok' } else { 'MISSING' }))
            }
          }
          $env:QT_PLUGIN_PATH = "$env:QT_ROOT_DIR\plugins"   # 헤드리스용 offscreen 플러그인
          $env:QT_QPA_PLATFORM = "offscreen"
          $code = Invoke-Timed 'deploy\ctrlsw_mock.exe' @('--version') 30
          if ($code -ne 0) { throw "ctrlsw_mock exit $code" }
          $code = Invoke-Timed 'deploy\CtrlSW.exe' @('--scenario', 'deploy\samples\demo.scenario.json', '--start', '--speed', '8', '--screenshot', 'smoke.png', '--screenshot-delay', '3000') 90
          if ($code -ne 0) { throw "CtrlSW exit $code" }
          if (-not (Test-Path smoke.png)) { throw "screenshot missing" }

      - name: Upload deploy folder
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: CtrlSW-windows-x64
          path: deploy

      - name: Upload smoke screenshot
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshot-windows
          path: smoke.png
