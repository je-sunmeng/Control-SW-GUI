name: build

on:
  push:
  pull_request:
  workflow_dispatch:

# Qt 6.8 LTS 로 macOS / Windows(MSVC) 빌드 + 전체 Qt Test 실행.
# Windows 는 windeployqt 배포 폴더를 아티팩트로 업로드 (ThinkPad 실행 점검용)
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-msvc
            os: windows-latest
            qt_arch: win64_msvc2022_64
          - name: macos
            os: macos-latest
            qt_arch: clang_64
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      QT_VERSION: "6.8.3"
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y --no-progress

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"
          -DCTRLSW_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure --timeout 120

      - name: Deploy (windeployqt)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force deploy | Out-Null
          Copy-Item build/src/CtrlSW.exe deploy/
          Copy-Item build/tools/mock_client/ctrlsw_mock.exe deploy/
          Copy-Item -Recurse samples deploy/samples
          Copy-Item resources/protocol/protocol.json deploy/protocol.json.example
          windeployqt --release --no-translations --compiler-runtime deploy/CtrlSW.exe
          windeployqt --release --no-translations deploy/ctrlsw_mock.exe

      - name: Smoke test (deployed exe)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          deploy/ctrlsw_mock.exe --version
          $p = Start-Process deploy/CtrlSW.exe -ArgumentList '-platform','offscreen','--scenario','deploy/samples/demo.scenario.json','--start','--speed','8','--screenshot','smoke.png','--screenshot-delay','3000' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "CtrlSW exit code $($p.ExitCode)" }
          if (-not (Test-Path smoke.png)) { throw "screenshot missing" }

      - name: Upload deploy folder
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: CtrlSW-windows-x64
          path: deploy

      - name: Upload smoke screenshot
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshot-windows
          path: smoke.png
